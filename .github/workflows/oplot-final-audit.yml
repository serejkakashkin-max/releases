name: Oplot Final Audit

on:
  push:
    branches:
      - agent/oplot-stage9-final-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-audit:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPLOT_FLASK_CONSOLE_VERBOSE: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Create isolated test runtime
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText((Join-Path $PWD 'config.json'), '{}', [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force -Path (Join-Path $PWD 'doc_templates') | Out-Null
          Write-Host "Created untracked synthetic config.json and empty doc_templates root for clean-runner imports"

      - name: Strict unittest suite
        shell: pwsh
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall .

      - name: Verify vendored assets
        shell: pwsh
        run: python tools/verify_vendor_assets.py

      - name: Check first-party JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path static/js -Filter *.js -File -Recurse
          if (-not $files) { throw "No first-party JavaScript files found" }
          foreach ($file in $files) {
            Write-Host "node --check $($file.FullName)"
            node --check $file.FullName
          }

      - name: Verify protected paths are not changed
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          $changed = @(git diff --name-only origin/main...HEAD)
          $forbidden = @(
            '^VA/schedule_manager/',
            '^doc_templates/',
            '^doc_templates_MPR/',
            '^static/vendor/',
            '^config\.json$',
            '^\.env($|\.)'
          )
          foreach ($path in $changed) {
            foreach ($pattern in $forbidden) {
              if ($path -match $pattern) {
                throw "Protected path changed during final audit: $path"
              }
            }
          }
          Write-Host "Protected path diff: OK"

      - name: Diff whitespace check
        shell: pwsh
        run: git diff --check origin/main...HEAD

  migration-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact migration delta
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import subprocess
          import zipfile
          from pathlib import Path

          BASE = "4d41d42446d21b06b53e06c8f8e1e67131f87394"
          TARGET = "e973887521f02373081bf487f880156503226007"
          ROOT = Path.cwd()
          OUT = ROOT / "migration_out"
          STAGE = OUT / "stage"
          OUT.mkdir(exist_ok=True)
          STAGE.mkdir(exist_ok=True)

          def git_list(*args: str) -> list[str]:
              data = subprocess.check_output(["git", *args])
              return [item.decode("utf-8", "surrogateescape") for item in data.split(b"\0") if item]

          changed = sorted(set(git_list(
              "diff", "--name-only", "-z", "--diff-filter=ACMRTUXB", BASE, TARGET
          )))
          deleted = sorted(set(git_list(
              "diff", "--name-only", "-z", "--diff-filter=D", BASE, TARGET
          )))

          copied: list[str] = []
          for rel in changed:
              probe = subprocess.run(
                  ["git", "cat-file", "-e", f"{TARGET}:{rel}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if probe.returncode != 0:
                  continue
              data = subprocess.check_output(["git", "show", f"{TARGET}:{rel}"])
              dest = STAGE / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              copied.append(rel)

          (STAGE / "DELETED_FILES.txt").write_text(
              "\n".join(deleted) + ("\n" if deleted else ""), encoding="utf-8"
          )
          (STAGE / "CHANGED_FILES.txt").write_text(
              "\n".join(copied) + "\n", encoding="utf-8"
          )

          readme = f"""OPLOT — пакет переноса модернизации на рабочий стенд

Исходное состояние до модернизации:
{BASE}

Целевое состояние GitHub main:
{TARGET}

Файлов для добавления/замены: {len(copied)}
Файлов для удаления: {len(deleted)}

КАК ПРИМЕНЯТЬ
1. Сделать резервную копию рабочей локальной копии проекта или создать отдельную Git-ветку в Bitbucket-репозитории.
2. Распаковать ZIP в КОРЕНЬ проекта с сохранением структуры каталогов и заменой существующих файлов.
3. Открыть DELETED_FILES.txt и удалить перечисленные там файлы из рабочей копии, если они существуют.
4. Выполнить установку/синхронизацию Python-зависимостей из requirements.txt.
5. Проверить git status и убедиться, что config.json, .env, реальные DOCX и runtime-данные стенда не были заменены случайно.
6. Запустить тесты/приложение локально, затем commit/push в Bitbucket.

ВАЖНО
- Архив содержит NET-дельту между указанными commit SHA, а не весь репозиторий.
- Файлы внутри имеют финальное содержимое TARGET и исходные относительные пути проекта.
- DELETED_FILES.txt, CHANGED_FILES.txt и MIGRATION_README.txt — служебные файлы пакета, их не требуется коммитить в Bitbucket.
"""
          (STAGE / "MIGRATION_README.txt").write_text(readme, encoding="utf-8")

          zip_path = OUT / "OPLOT_migration_4d41d424_to_e9738875.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(STAGE.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(STAGE).as_posix())

          print(f"PACKAGE={zip_path}")
          print(f"COPIED={len(copied)}")
          print(f"DELETED={len(deleted)}")
          print("--- DELETED FILES ---")
          for rel in deleted:
              print(rel)
          print("--- END DELETED FILES ---")
          '@ | Set-Content -Path build_migration_package.py -Encoding UTF8
          python build_migration_package.py

      - name: Upload migration package
        uses: actions/upload-artifact@v4
        with:
          name: oplot-migration-package
          path: migration_out/OPLOT_migration_4d41d424_to_e9738875.zip
          if-no-files-found: error
          retention-days: 7
