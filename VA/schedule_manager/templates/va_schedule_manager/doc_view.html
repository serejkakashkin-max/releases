{% extends "va_schedule_manager/base.html" %}

{% block title %}{{ doc_title }}{% endblock %}
{% set oplot_page_title = doc_title %}
{% set oplot_page_description = 'Просмотр документации' %}

{% block va_body %}
  <section class="panel">
    <div class="section-header">
      <div>
        <h2>{{ doc_title }}</h2>
        <p>{{ filename }}</p>
      </div>
      <div class="section-actions">
        <a class="button button-light" href="{{ va_url_for('va_schedule_manager.web.docs_index') }}">К списку</a>
        <a class="button button-secondary" href="{{ va_url_for('va_schedule_manager.web.docs_download', filename=filename) }}">Скачать</a>
      </div>
    </div>

    <article class="doc-content">
      {{ content }}
    </article>
  </section>
{% endblock %}
